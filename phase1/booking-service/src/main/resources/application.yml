server:
  port: 8082
spring:
  application: {name: booking-service}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${DB_USERNAME:traveluser}
    password: ${DB_PASSWORD:travelpass}
  jpa: {hibernate: {ddl-auto: validate}, open-in-view: false}
  flyway: {enabled: true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
